name: Probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://www.amiiboapi.com/api/amiibo/" \
            "https://www.amiiboapi.com/api/amiibo" \
            "https://amiiboapi.com/api/amiibo/" \
            "https://www.amiiboapi.org/api/amiibo/" \
            "https://amiiboapi.org/api/amiibo/" \
            "https://www.amiiboapi.com/api/amiibo/?name=mario" \
            "https://www.amiiboapi.org/api/amiibo/?id=0000000000000002&showusage" \
            "https://www.amiiboapi.com/" ; do
            echo "=== $u"
            curl -sSL -A "Mozilla/5.0" -o body.txt -w "status=%{http_code} type=%{content_type} final=%{url_effective}\n" --max-time 30 "$u" || true
            head -c 400 body.txt; echo
          done
