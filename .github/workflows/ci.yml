name: CI

on:
  push:
    branches-ignore: [master]
  pull_request:
    branches: [master]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Test AmiiboCore
        working-directory: ios/AmiiboCore
        run: swift test
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build app for simulator
        run: |
          xcodebuild build \
            -project AmiiboFinder.xcodeproj \
            -scheme AmiiboFinder \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
